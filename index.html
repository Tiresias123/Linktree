anada · France",role:"Juriste Fiscaliste · Élève-Avocat",location:"Montréal, QC",localTime:"heure locale",bio:"J'assiste les particuliers et les entreprises dans la gestion de leurs obligations fiscales au Canada et en France, avec une expertise particulière pour les enjeux transfrontaliers, les cryptoactifs et la formation.",actionConsultation:"Prendre Rendez-vous",actionConsultationSub:"30 minutes · agenda en ligne",actionCv:"Curriculum vitae",actionCvSub:"Document PDF",actionProspectus:"Prospectus de services",actionProspectusSub:"Offre détaillée · PDF",actionEducation:"Parcours & équivalence",actionEducationSub:"UdeM · Barreau du Québec",actionContact:"Me contacter",actionContactSub:go,tabProfile:"Profil",tabServices:"Services",tabEducation:"Parcours",profileTitle:"Profil professionnel",profileText:"Titulaire d'un Master 2 en droit fiscal en France et fort d'expériences au sein de cabinets d'avocats internationaux à Paris, Diwan Steunou a développé ses compétences au Canada. Il a participé à la création du département de fiscalité des particuliers chez MSGL par FIDUCIAL à Montréal (QC), avant de rejoindre l'équipe fiscale de Wealthsimple. Aujourd'hui élève-avocat à l'École du Barreau de Montréal, il apporte une assistance simple et efficace aux particuliers et aux entreprises pour leurs obligations fiscales canadiennes et françaises (incluant les cryptoactifs), et propose des formations en fiscalité nord-américaine et européenne.",skillsHeading:"Champs de compétences",skillsList:[{title:"Fiscalité transfrontalière des particuliers",desc:"Mobilité internationale, obligations franco-canadiennes et fiscalité des cryptoactifs."},{title:"Fiscalité et documentation sociale des sociétés",desc:"Conformité d'entreprise, déclarations de revenus corporatives et secrétariat juridique."},{title:"Analyse et révision fiscale",desc:"Recherche de crédits d'impôt, opportunités d'économies légitimes et régularisations, en projet."},{title:"Rédaction technique et formation",desc:"R
